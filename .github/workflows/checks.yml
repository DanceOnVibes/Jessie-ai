name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Knowledge packs and teacher rules
        run: npm run check:knowledge
      - name: Tests
        run: npm test
      - name: Build (includes the TypeScript check)
        run: npm run build

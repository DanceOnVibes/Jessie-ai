metadata:
  file_name: "immune_system_qa.yaml"
  title: "Jessie Immune System QA Pairs"
  domain: "body_systems"
  topic: "immune_system"
  version: "2.0"
  last_updated: "2026-09-21"
  purpose: "Expanded beginner-friendly question-answer pairs for teaching Jessie how to explain the immune system clearly, warmly, and safely with broad retrieval support."
  audience: "Jessie AI training and retrieval support layer"
  source_type: "internal structured QA pairs"

overview:
  summary: "These QA pairs teach Jessie to explain the immune system as the body system that helps protect the body from harmful germs and supports defense against infection. Jessie should explain core beginner concepts such as white blood cells, inflammation, immunity, lymph nodes, spleen, bone marrow, thymus, and the protective role of the skin. The set also supports broader biology and visual explanation use by including structure-function relationships, system connections, misconceptions, and practical safety boundaries. Jessie should remain warm, direct, beginner-friendly, and non-diagnosing, while giving calm safety-first guidance for trouble breathing, face or throat swelling, high fever with confusion, or rapidly worsening infection symptoms."
  training_goals:
    - "Explain the immune system in simple, beginner-friendly language"
    - "Teach core immune concepts such as white blood cells, inflammation, and immunity"
    - "Show the roles of lymph nodes, spleen, bone marrow, and thymus"
    - "Explain how the skin helps as a protective barrier"
    - "Support broader biology and visual explanation retrieval with defense and structure-function concepts"
    - "Correct common misconceptions about germs, inflammation, and immune activity"
    - "Maintain a warm, direct, educational tone"
    - "Use safe boundaries for serious infection and allergic emergency symptoms"

behavior_contract:
  teaching_focus:
    - "Teach the immune system as a defense and protection system"
    - "Explain immune cells, organs, and defense responses simply"
    - "Connect immune structures to protective function in a clear beginner-friendly way"
    - "Support both basic biology teaching and visual explanation of body defense"
    - "Keep answers short unless more detail is requested"
  tone:
    - "Warm"
    - "Calm"
    - "Direct"
    - "Beginner-friendly"
    - "Educational"
  response_principles:
    - "Answer directly first."
    - "Add a short explanation only when useful."
    - "Prefer clear everyday wording over technical language."
    - "Keep retrieval answers compact and reusable."
  boundaries:
    - "Jessie should not diagnose infections, immune disorders, allergic reactions, sepsis, or causes of fever and swelling."
    - "Jessie should not claim certainty from brief symptom descriptions."
    - "Jessie can explain general immune concepts, defense roles, and warning signs."
  safety_escalation:
    - "Urgent guidance is appropriate for trouble breathing, swelling of the face or throat, high fever with confusion, or rapidly worsening infection symptoms."

pairs:
  - id: "immune_system_qa_001"
    category: "foundational_definition"
    question: "What does the immune system do?"
    answer: "The immune system helps protect the body from harmful germs and helps fight infections."

  - id: "immune_system_qa_002"
    category: "foundational_definition"
    question: "What is the immune system?"
    answer: "The immune system is the body system that helps defend the body from harmful germs and other threats."

  - id: "immune_system_qa_003"
    category: "foundational_definition"
    question: "Why is the immune system important?"
    answer: "It is important because it helps protect the body from harmful germs and supports recovery from infections."

  - id: "immune_system_qa_004"
    category: "foundational_definition"
    question: "What is immunity?"
    answer: "Immunity is the body's ability to resist or fight certain infections."

  - id: "immune_system_qa_005"
    category: "foundational_definition"
    question: "What is inflammation?"
    answer: "Inflammation is part of the body's defense response and can cause redness, warmth, swelling, or pain."

  - id: "immune_system_qa_006"
    category: "system_roles"
    question: "What are white blood cells?"
    answer: "White blood cells are cells that help the body detect and fight infection."

  - id: "immune_system_qa_007"
    category: "system_roles"
    question: "Why are lymph nodes important?"
    answer: "Lymph nodes help support immune responses and help filter lymph fluid."

  - id: "immune_system_qa_008"
    category: "system_roles"
    question: "What does the spleen do in the immune system?"
    answer: "The spleen helps filter blood and supports immune defense."

  - id: "immune_system_qa_009"
    category: "system_roles"
    question: "What does bone marrow do?"
    answer: "Bone marrow produces blood cells, including many immune cells."

  - id: "immune_system_qa_010"
    category: "system_roles"
    question: "What does the thymus do?"
    answer: "The thymus helps certain immune cells mature."

  - id: "immune_system_qa_011"
    category: "system_roles"
    question: "How is the immune system connected to the skin?"
    answer: "The skin helps protect the body as a first barrier against germs, so it works closely with immune defense."

  - id: "immune_system_qa_012"
    category: "process"
    question: "How does the immune system help with infection?"
    answer: "The immune system recognizes harmful germs and uses cells and responses to help fight them."

  - id: "immune_system_qa_013"
    category: "process"
    question: "How does the immune system work in simple terms?"
    answer: "It works by detecting threats, responding to them, and helping protect the body from harm."

  - id: "immune_system_qa_014"
    category: "process"
    question: "Why are white blood cells important?"
    answer: "They are important because they help the body recognize and respond to infection."

  - id: "immune_system_qa_015"
    category: "process"
    question: "Why does inflammation happen?"
    answer: "Inflammation happens as part of the body's defense response to injury or harmful germs."

  - id: "immune_system_qa_016"
    category: "process"
    question: "What happens when the immune system is working normally?"
    answer: "When it is working normally, it helps protect the body and respond to threats."

  - id: "immune_system_qa_017"
    category: "term_clarification"
    question: "What is the difference between immunity and inflammation?"
    answer: "Immunity is the body's ability to resist or fight infection, while inflammation is one kind of defense response."

  - id: "immune_system_qa_018"
    category: "term_clarification"
    question: "What is the difference between white blood cells and germs?"
    answer: "White blood cells are part of the body, while germs are outside threats such as bacteria or viruses."

  - id: "immune_system_qa_019"
    category: "term_clarification"
    question: "What is the difference between the immune system and the lymphatic system?"
    answer: "They are closely connected, and the lymphatic system supports immune function by moving lymph and housing immune structures."

  - id: "immune_system_qa_020"
    category: "term_clarification"
    question: "What is the difference between protection and inflammation?"
    answer: "Protection is the broader job of the immune system, while inflammation is one specific defense response."

  - id: "immune_system_qa_021"
    category: "misconception"
    question: "Does the immune system only work when you are sick?"
    answer: "No. The immune system is always helping protect the body, even when you do not notice it."

  - id: "immune_system_qa_022"
    category: "misconception"
    question: "Is inflammation always bad?"
    answer: "No. Inflammation can be part of a normal defense response, although too much or ongoing inflammation can be harmful."

  - id: "immune_system_qa_023"
    category: "misconception"
    question: "Are white blood cells germs?"
    answer: "No. White blood cells are part of the body and help fight germs."

  - id: "immune_system_qa_024"
    category: "misconception"
    question: "Does the skin only cover the body and do nothing else for immunity?"
    answer: "No. The skin also acts as an important protective barrier."

  - id: "immune_system_qa_025"
    category: "misconception"
    question: "Do all immune organs do exactly the same job?"
    answer: "No. Different immune structures help in different ways."

  - id: "immune_system_qa_026"
    category: "everyday_example"
    question: "Why can a cut become red and warm?"
    answer: "That can happen because inflammation is part of the body's defense response."

  - id: "immune_system_qa_027"
    category: "everyday_example"
    question: "Why does the body need barriers like skin?"
    answer: "The body needs barriers like skin to help block germs from entering."

  - id: "immune_system_qa_028"
    category: "everyday_example"
    question: "Why can lymph nodes become more noticeable during infection?"
    answer: "They can become more noticeable because they are involved in immune responses."

  - id: "immune_system_qa_029"
    category: "everyday_example"
    question: "Why does the body need immune cells made in bone marrow?"
    answer: "The body needs those cells because immune defense depends on specialized blood and immune cells."

  - id: "immune_system_qa_030"
    category: "everyday_example"
    question: "Why does the body need the spleen?"
    answer: "The body needs the spleen because it helps filter blood and support immune defense."

  - id: "immune_system_qa_031"
    category: "visual_art_support"
    question: "Why is the immune system useful to understand in biology illustration?"
    answer: "It helps show how the body defends itself using cells, tissues, and organs."

  - id: "immune_system_qa_032"
    category: "visual_art_support"
    question: "What should an artist know about immune system diagrams?"
    answer: "An artist should know the main immune structures and the idea that the body uses multiple defenses working together."

  - id: "immune_system_qa_033"
    category: "visual_art_support"
    question: "Why do lymph nodes matter in educational diagrams?"
    answer: "They matter because they are important immune structures that support defense responses."

  - id: "immune_system_qa_034"
    category: "visual_art_support"
    question: "Why is skin included in immune-related teaching visuals?"
    answer: "Skin is included because it acts as a first protective barrier against germs."

  - id: "immune_system_qa_035"
    category: "boundary"
    question: "Can you diagnose whether I have an infection?"
    answer: "No. I can't diagnose infection from limited information, but I can explain immune concepts and point out warning signs."

  - id: "immune_system_qa_036"
    category: "boundary"
    question: "Can you tell me exactly why my lymph nodes feel swollen?"
    answer: "No. I can't determine the exact cause from a brief description, but I can explain general immune concepts and when medical care may be important."

  - id: "immune_system_qa_037"
    category: "boundary"
    question: "Does every fever mean the same type of infection?"
    answer: "No. Fever can happen for different reasons, so I can't assume the cause from that alone."

  - id: "immune_system_qa_038"
    category: "boundary"
    question: "Does swelling always mean an allergic emergency?"
    answer: "No. Swelling can happen for different reasons, so I can't assume the cause from that alone."

  - id: "immune_system_qa_039"
    category: "safety_supportive_urgent"
    question: "What should someone do if they have trouble breathing, swelling of the face or throat, high fever with confusion, or rapidly worsening infection symptoms?"
    answer: "Those can be serious or emergency symptoms, so urgent medical care is important right away."

  - id: "immune_system_qa_040"
    category: "safety_supportive_urgent"
    question: "Should trouble breathing with swelling of the face or throat be treated as an emergency?"
    answer: "Yes. Trouble breathing with face or throat swelling can be an emergency and needs urgent medical care."

  - id: "immune_system_qa_041"
    category: "safety_supportive_urgent"
    question: "Should high fever with confusion be taken seriously?"
    answer: "Yes. High fever with confusion can be serious and needs urgent medical attention."

  - id: "immune_system_qa_042"
    category: "safety_supportive_urgent"
    question: "Should rapidly worsening infection symptoms be ignored?"
    answer: "No. Rapidly worsening infection symptoms should be medically checked right away."

  - id: "immune_system_qa_043"
    category: "teaching_summary"
    question: "What is the main thing to remember about the immune system?"
    answer: "The main thing to remember is that the immune system helps protect the body from harmful germs using many connected defenses."


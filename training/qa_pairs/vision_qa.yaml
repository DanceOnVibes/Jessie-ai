  - "Answers stay warm, direct, beginner-friendly, and non-diagnosing."
  - "Vision is consistently explained as light detection with eye-brain interpretation."
  - "The set includes support for biology teaching, sensory pathway concepts, and visual explanation retrieval."
  - "Safety items escalate clearly without pretending certainty."

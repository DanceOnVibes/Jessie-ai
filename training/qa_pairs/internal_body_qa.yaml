  - id: "internal_body_sense_qa_036"
    category: "safety_supportive_urgent"
    question: "Should sudden severe shortness of breath with chest pressure be ignored?"
    answer: "No. Sudden severe shortness of breath with chest pressure should be treated as urgent and checked right away."

  - id: "internal_body_sense_qa_037"
    category: "safety_supportive_urgent"

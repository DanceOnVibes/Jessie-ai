  - id: "internal_body_sense_qa_039"
    category: "safety_supportive_urgent"
    question: "Should sudden severe breathing difficulty be treated urgently?"
    answer: "Yes. Sudden severe breathing difficulty needs urgent medical attention."

  - id: "internal_body_sense_qa_040"

    question: "Is body position sense only important for athletes?"
    answer: "No. Everyone uses it in everyday movement."

  - id: "body_position_qa_025"
    category: "misconception"
    question: "Does numbness only affect touch and not movement?"
    answer: "No. Reduced sensory information can also make movement and coordination harder."

  - id: "body_position_qa_026"
    category: "misconception"
    question: "If someone feels clumsy once, does that always mean something serious is wrong?"
    answer: "No. A single awkward movement does not automatically mean a serious problem."


evaluation:
  title: "Jessie Learning Theory Evaluation Set"
  domain: "education_foundations"
  topic: "learning_theory"
  version: "1.1"
  last_updated: "2026-09-21"
  purpose: "Evaluation prompts for assessing understanding of learning theory, major frameworks of learning, memory, attention, reinforcement, practice, feedback, motivation, developmental and social influences, and safe educational support boundaries."
  audience: "Jessie AI evaluation layer"
  source_type: "internal structured evaluation examples"

  cases:
    - id: "learning_theory_eval_001"
      prompt: "What is learning theory?"
      expected: "Learning theory is the study of how people acquire knowledge, skills, behaviors, and understanding."

    - id: "learning_theory_eval_002"
      prompt: "Why is learning theory important?"
      expected: "Learning theory is important because it helps explain how learning happens and how teaching can be improved."

    - id: "learning_theory_eval_003"
      prompt: "Does learning theory only apply in schools?"
      expected: "No. Learning theory applies in schools, workplaces, therapy, coaching, and everyday life."

    - id: "learning_theory_eval_004"
      prompt: "Can learning involve both knowledge and skills?"
      expected: "Yes. Learning can involve facts, concepts, habits, strategies, and physical or mental skills."

    - id: "learning_theory_eval_005"
      prompt: "What is behaviorism in a simple way?"
      expected: "Behaviorism is a learning theory that focuses on observable behavior and how it is shaped by the environment."

    - id: "learning_theory_eval_006"
      prompt: "What is reinforcement in a simple way?"
      expected: "Reinforcement is something that increases the likelihood that a behavior will happen again."

    - id: "learning_theory_eval_007"
      prompt: "What is positive reinforcement?"
      expected: "Positive reinforcement means adding something rewarding after a behavior to increase that behavior."

    - id: "learning_theory_eval_008"
      prompt: "What is negative reinforcement?"
      expected: "Negative reinforcement means removing something unpleasant after a behavior to increase that behavior."

    - id: "learning_theory_eval_009"
      prompt: "Is negative reinforcement the same as punishment?"
      expected: "No. Negative reinforcement increases behavior by removing something unpleasant, while punishment aims to reduce behavior."

    - id: "learning_theory_eval_010"
      prompt: "What is punishment in learning theory?"
      expected: "Punishment is a consequence intended to reduce the likelihood of a behavior."

    - id: "learning_theory_eval_011"
      prompt: "What is classical conditioning in a simple way?"
      expected: "Classical conditioning is learning through association between stimuli."

    - id: "learning_theory_eval_012"
      prompt: "What is operant conditioning in a simple way?"
      expected: "Operant conditioning is learning through consequences such as reinforcement or punishment."

    - id: "learning_theory_eval_013"
      prompt: "What is cognitive learning theory in a simple way?"
      expected: "Cognitive learning theory focuses on mental processes such as attention, memory, thinking, and problem-solving."

    - id: "learning_theory_eval_014"
      prompt: "What is constructivism in a simple way?"
      expected: "Constructivism is the idea that learners actively build understanding based on experience and prior knowledge."

    - id: "learning_theory_eval_015"
      prompt: "What is social learning theory in a simple way?"
      expected: "Social learning theory emphasizes learning through observing others, modeling, and social interaction."

    - id: "learning_theory_eval_016"
      prompt: "Can people learn by watching others?"
      expected: "Yes. Observation and modeling are important ways people learn."

    - id: "learning_theory_eval_017"
      prompt: "Does prior knowledge affect new learning?"
      expected: "Yes. Prior knowledge strongly affects how new information is understood and remembered."

    - id: "learning_theory_eval_018"
      prompt: "Can motivation affect learning?"
      expected: "Yes. Motivation can influence attention, effort, persistence, and engagement in learning."

    - id: "learning_theory_eval_019"
      prompt: "Can attention affect learning?"
      expected: "Yes. Attention helps learners focus on important information."

    - id: "learning_theory_eval_020"
      prompt: "Can memory affect learning?"
      expected: "Yes. Learning depends on encoding, storing, and retrieving information."

    - id: "learning_theory_eval_021"
      prompt: "What is practice in learning?"
      expected: "Practice is repeated engagement with a task or idea to improve performance or understanding."

    - id: "learning_theory_eval_022"
      prompt: "Can repetition support learning?"
      expected: "Yes. Repetition can help strengthen memory and skill performance."

    - id: "learning_theory_eval_023"
      prompt: "Can feedback support learning?"
      expected: "Yes. Feedback helps learners understand what they are doing well and what to improve."

    - id: "learning_theory_eval_024"
      prompt: "Can immediate feedback sometimes be useful?"
      expected: "Yes. Immediate feedback can help correct errors and reinforce understanding quickly."

    - id: "learning_theory_eval_025"
      prompt: "Can delayed feedback also be useful?"
      expected: "Yes. Delayed feedback can support reflection and deeper understanding in some contexts."

    - id: "learning_theory_eval_026"
      prompt: "Can mistakes be part of learning?"
      expected: "Yes. Mistakes can provide information that supports learning and improvement."

    - id: "learning_theory_eval_027"
      prompt: "Does learning always happen quickly?"
      expected: "No. Learning may happen gradually and often requires time, repetition, and support."

    - id: "learning_theory_eval_028"
      prompt: "Can learning be influenced by the environment?"
      expected: "Yes. The learning environment can affect attention, motivation, and performance."

    - id: "learning_theory_eval_029"
      prompt: "Can stress affect learning?"
      expected: "Yes. Stress can affect attention, memory, and the ability to learn effectively."

    - id: "learning_theory_eval_030"
      prompt: "Can sleep affect learning?"
      expected: "Yes. Sleep supports memory, learning, and cognitive function."

    - id: "learning_theory_eval_031"
      prompt: "Can emotion affect learning?"
      expected: "Yes. Emotion can influence attention, motivation, memory, and engagement."

    - id: "learning_theory_eval_032"
      prompt: "What is active learning in a simple way?"
      expected: "Active learning involves engaging directly with material through thinking, doing, discussing, or applying."

    - id: "learning_theory_eval_033"
      prompt: "Can discussion support learning?"
      expected: "Yes. Discussion can help learners process ideas and deepen understanding."

    - id: "learning_theory_eval_034"
      prompt: "Can teaching others support learning?"
      expected: "Yes. Explaining ideas to others can strengthen understanding."

    - id: "learning_theory_eval_035"
      prompt: "Can problem-solving support learning?"
      expected: "Yes. Problem-solving helps learners apply knowledge and develop understanding."

    - id: "learning_theory_eval_036"
      prompt: "Can hands-on experience support learning?"
      expected: "Yes. Experience and practice can improve understanding and skill development."

    - id: "learning_theory_eval_037"
      prompt: "Can learning involve transfer?"
      expected: "Yes. Transfer means applying what was learned in one setting to another setting."

    - id: "learning_theory_eval_038"
      prompt: "What is transfer of learning?"
      expected: "Transfer of learning is using knowledge or skills from one situation in a different situation."

    - id: "learning_theory_eval_039"
      prompt: "Can context affect how well something is learned?"
      expected: "Yes. Context can influence understanding, memory, and performance."

    - id: "learning_theory_eval_040"
      prompt: "Can learning be easier when new information connects to existing knowledge?"
      expected: "Yes. Meaningful connections to what a learner already knows can improve learning."

    - id: "learning_theory_eval_041"
      prompt: "Can goals influence learning?"
      expected: "Yes. Clear goals can improve focus, effort, and direction in learning."

    - id: "learning_theory_eval_042"
      prompt: "Can self-monitoring help learning?"
      expected: "Yes. Self-monitoring helps learners reflect on progress and adjust strategies."

    - id: "learning_theory_eval_043"
      prompt: "What is metacognition in a simple way?"
      expected: "Metacognition is thinking about one's own thinking and learning."

    - id: "learning_theory_eval_044"
      prompt: "Can metacognition improve learning?"
      expected: "Yes. Metacognition helps learners choose strategies, monitor progress, and adjust when needed."

    - id: "learning_theory_eval_045"
      prompt: "Can learners use different strategies for learning?"
      expected: "Yes. Different strategies such as repetition, organization, retrieval, and explanation can support learning."

    - id: "learning_theory_eval_046"
      prompt: "Can retrieval practice help learning?"
      expected: "Yes. Actively recalling information can strengthen learning and memory."

    - id: "learning_theory_eval_047"
      prompt: "Can spacing study over time help learning?"
      expected: "Yes. Spaced practice often supports stronger retention than cramming."

    - id: "learning_theory_eval_048"
      prompt: "Can cramming be less effective for long-term retention?"
      expected: "Yes. Cramming may help short-term recall but is often weaker for long-term learning."

    - id: "learning_theory_eval_049"
      prompt: "Can learners differ in what supports them?"
      expected: "Yes. Learners differ in background, needs, strengths, and effective supports."

    - id: "learning_theory_eval_050"
      prompt: "Does learning theory suggest one method works best for every learner in every situation?"
      expected: "No. Effective learning often depends on the learner, the task, and the context."

    - id: "learning_theory_eval_051"
      prompt: "Can developmental stage affect learning?"
      expected: "Yes. Developmental stage can influence how learners think, understand, and respond."

    - id: "learning_theory_eval_052"
      prompt: "Can social interaction support learning?"
      expected: "Yes. Interaction with others can support understanding, modeling, and feedback."

    - id: "learning_theory_eval_053"
      prompt: "Can cooperative learning support understanding?"
      expected: "Yes. Working with others can support learning through discussion and shared problem-solving."

    - id: "learning_theory_eval_054"
      prompt: "Can modeling be useful in teaching skills?"
      expected: "Yes. Demonstrating a skill can help learners understand how to perform it."

    - id: "learning_theory_eval_055"
      prompt: "Can scaffolding support learning?"
      expected: "Yes. Scaffolding provides temporary support that helps a learner succeed while developing independence."

    - id: "learning_theory_eval_056"
      prompt: "What is scaffolding in a simple way?"
      expected: "Scaffolding is support that helps a learner complete a task they could not yet do alone."

    - id: "learning_theory_eval_057"
      prompt: "Can learning involve both explicit instruction and discovery?"
      expected: "Yes. Learning can be supported through direct teaching, guided discovery, or a combination."

    - id: "learning_theory_eval_058"
      prompt: "Can curiosity support learning?"
      expected: "Yes. Curiosity can increase attention, exploration, and motivation."

    - id: "learning_theory_eval_059"
      prompt: "Can rewards influence behavior in learning?"
      expected: "Yes. Rewards can affect motivation and behavior, especially in behavior-based models."

    - id: "learning_theory_eval_060"
      prompt: "Can intrinsic motivation differ from extrinsic motivation?"
      expected: "Yes. Intrinsic motivation comes from internal interest, while extrinsic motivation comes from outside rewards or pressures."

    - id: "learning_theory_eval_061"
      prompt: "Can confidence affect learning?"
      expected: "Yes. Confidence can influence effort, persistence, and willingness to try."

    - id: "learning_theory_eval_062"
      prompt: "Can a supportive environment improve learning?"
      expected: "Yes. Supportive environments can improve participation, confidence, and persistence."

    - id: "learning_theory_eval_063"
      prompt: "Can fear or humiliation interfere with learning?"
      expected: "Yes. Fear and humiliation can reduce safety, participation, and effective learning."

    - id: "learning_theory_eval_064"
      prompt: "Can learning theory be used in rehabilitation or skills training?"
      expected: "Yes. Learning theory is used in many settings including rehabilitation, coaching, and workplace training."

    - id: "learning_theory_eval_065"
      prompt: "Can learning involve changes in behavior that are not immediately visible?"
      expected: "Yes. Learning may involve internal understanding before it shows in observable performance."

    - id: "learning_theory_eval_066"
      prompt: "Can performance and learning be different?"
      expected: "Yes. A person may perform poorly temporarily even if learning is developing, and good short-term performance does not always mean deep learning."

    - id: "learning_theory_eval_067"
      prompt: "Can prior misconceptions affect learning?"
      expected: "Yes. Misconceptions can interfere with new understanding and may need to be addressed directly."

    - id: "learning_theory_eval_068"
      prompt: "Can examples and analogies support learning?"
      expected: "Yes. Examples and analogies can make abstract ideas easier to understand."

    - id: "learning_theory_eval_069"
      prompt: "Can reflection support learning?"
      expected: "Yes. Reflection can help learners consolidate understanding and improve strategy use."

    - id: "learning_theory_eval_070"
      prompt: "Can repeated practice alone guarantee deep understanding?"
      expected: "No. Practice helps, but understanding also depends on meaning, feedback, and application."

    - id: "learning_theory_eval_071"
      prompt: "Can learning theory help teachers choose methods intentionally?"
      expected: "Yes. Learning theory helps guide teaching strategies and instructional design."

    - id: "learning_theory_eval_072"
      prompt: "Can different theories emphasize different parts of learning?"
      expected: "Yes. Different theories emphasize behavior, cognition, social factors, development, or active construction of knowledge."

    - id: "learning_theory_eval_073"
      prompt: "Can learning be lifelong?"
      expected: "Yes. Learning continues across the lifespan in many settings."

    - id: "learning_theory_eval_074"
      prompt: "Can educational support need referral when a learner shows severe distress or safety concerns?"
      expected: "Yes. Severe distress, self-harm concerns, or major safety issues require prompt referral to appropriate human support."

    - id: "learning_theory_eval_075"
      prompt: "Should a learner expressing thoughts of self-harm be treated as a routine study issue?"
      expected: "No. Self-harm concerns are serious and require immediate human support."

    - id: "learning_theory_eval_076"
      prompt: "Should major confusion, sudden severe behavior change, or inability to function be ignored in an educational setting?"
      expected: "No. Serious sudden changes should be addressed promptly with appropriate human support."

    - id: "learning_theory_eval_077"
      prompt: "What is the main idea of learning theory?"
      expected: "Learning theory explains how people acquire knowledge, skills, and behaviors and helps guide effective teaching and support."

    - id: "learning_theory_eval_078"
      prompt: "Can learning theory include behavior, thinking, memory, motivation, and social influence together?"
      expected: "Yes. Learning theory includes multiple perspectives on how learning happens."

    - id: "learning_theory_eval_079"
      prompt: "Can good learning support involve practice, feedback, motivation, and adaptation to the learner?"
      expected: "Yes. Effective learning often involves all of those elements."

    - id: "learning_theory_eval_080"
      prompt: "What should be done if a learning-related situation includes severe distress, safety concerns, self-harm statements, or inability to function?"
      expected: "Serious distress or safety concerns require prompt human support and appropriate escalation."

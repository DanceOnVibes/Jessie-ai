training_master_checklist:
  file_name: "jessie_training_master_checklist.yaml"
  version: "1.0"
  last_updated: "2026-09-21"
  purpose: "Master review checklist for Jessie AI training assets across evaluation sets, QA pairs, conversation examples, knowledge packs, and style/system files."
  audience: "Jessie AI family development workflow"
  source_type: "assistant-generated project checklist"

  review_workflow:
    status_key:
      - "present"
      - "generated"
      - "needs_review"
      - "needs_creation"
      - "needs_alignment"
      - "unknown"
    recommended_order:
      - "1_style_guides"
      - "2_system_rules"
      - "3_evaluation_sets"
      - "4_qa_pairs"
      - "5_conversation_examples"
      - "6_knowledge_pack"
      - "7_cross_dataset_alignment"
      - "8_final_quality_audit"

  1_style_guides:
    items:
      - name: "jessie_teaching_style.yaml"
        path: "training/style_guides/jessie_teaching_style.yaml"
        status: "generated"
        notes: "Master teaching and tone guide upgraded to higher standard. Needs final real-folder verification."

      - name: "qa_pair_style_guide.yaml"
        path: "training/style_guides/qa_pair_style_guide.yaml"
        status: "needs_creation"
        notes: "Recommended to define answer length, directness, canonical phrasing, and safety style for QA assets."

      - name: "conversation_example_style_guide.yaml"
        path: "training/style_guides/conversation_example_style_guide.yaml"
        status: "needs_creation"
        notes: "Recommended to define empathy, pacing, clarification, escalation behavior, and dialogue realism."

      - name: "knowledge_pack_style_guide.yaml"
        path: "training/style_guides/knowledge_pack_style_guide.yaml"
        status: "needs_creation"
        notes: "Recommended to define factual density, structure, concept linking, and warning-sign framing."

      - name: "evaluation_style_guide.yaml"
        path: "training/style_guides/evaluation_style_guide.yaml"
        status: "needs_creation"
        notes: "Recommended to standardize prompt phrasing, expected answer style, and safety wording."

  2_system_rules:
    items:
      - name: "global_escalation_framework"
        path: "training/system_rules/global_escalation_framework.yaml"
        status: "needs_creation"
        notes: "Recommended. Should define monitor / prompt / urgent / emergency language and response rules."

      - name: "safety_response_rules"
        path: "training/system_rules/safety_response_rules.yaml"
        status: "needs_creation"
        notes: "Recommended. Should define how Jessie handles red flags, emergencies, and action-first situations."

      - name: "body_system_teaching_rules"
        path: "training/system_rules/body_system_teaching_rules.yaml"
        status: "needs_creation"
        notes: "Recommended. Should define standard teaching format for organs, systems, and functions."

      - name: "symptom_response_rules"
        path: "training/system_rules/symptom_response_rules.yaml"
        status: "needs_creation"
        notes: "Recommended. Should define distinction between general education and symptom escalation."

      - name: "clarifying_question_rules"
        path: "training/system_rules/clarifying_question_rules.yaml"
        status: "needs_creation"
        notes: "Recommended. Should define when Jessie asks follow-up questions versus when Jessie escalates immediately."

  3_evaluation_sets:
    items:
      - name: "smell_eval.yaml"
        path: "training/evaluation_sets/smell_eval.yaml"
        status: "generated"
        notes: "Generated in conversation. Review folder presence and wording consistency."

      - name: "taste_eval.yaml"
        path: "training/evaluation_sets/taste_eval.yaml"
        status: "generated"
        notes: "Generated in conversation. Review folder presence and wording consistency."


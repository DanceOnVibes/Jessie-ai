        path: "training/evaluation_sets/touch_eval.yaml"
        status: "generated"
        notes: "Generated in conversation. Review folder presence and wording consistency."

      - name: "urinary_system_eval.yaml"
        path: "training/evaluation_sets/urinary_system_eval.yaml"
        status: "generated"
        notes: "Generated in conversation. Review folder presence and wording consistency."

      - name: "vision_eval.yaml"
        path: "training/evaluation_sets/vision_eval.yaml"
        status: "generated"
        notes: "Generated in conversation. Review folder presence and wording consistency."

      - name: "vestibular_eval.yaml"

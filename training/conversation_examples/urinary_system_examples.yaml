    category: "teaching_summary"
    user_message: "What is the main thing to remember about the urinary system?"
    assistant_message: "The main thing to remember is the urine pathway: kidneys make urine, ureters carry it, bladder stores it, and the urethra lets it leave the body."

  - id: "urinary_system_example_060"
    category: "teaching_summary"
    user_message: "What is the simplest safe takeaway about urinary symptoms?"
    assistant_message: "The simplest takeaway is that urinary system questions can often be explained generally, but inability to urinate, severe side pain, blood in urine, fever with urinary symptoms, or signs of severe illness should be medically checked right away."


  - id: "urinary_system_example_015"
    category: "sensory_integration"
    user_message: "How is urinary waste different from digestive waste?"
    assistant_message: "The urinary system removes liquid waste, while the digestive system removes solid waste."

  - id: "urinary_system_example_016"
    category: "sensory_integration"
    user_message: "So they both remove waste, but in different forms?"
    assistant_message: "Exactly. They both help with waste removal, but they handle different kinds."

  - id: "urinary_system_example_017"
    category: "sensory_integration"
    user_message: "Why does the urinary system help with fluid balance?"
    assistant_message: "It helps by removing liquid waste and helping the body regulate how much fluid stays in balance."

  - id: "urinary_system_example_018"
    category: "sensory_integration"

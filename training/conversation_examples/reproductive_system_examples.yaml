  - id: "reproductive_system_example_060"
    category: "teaching_summary"
    user_message: "What is the simplest safe takeaway about reproductive symptoms?"
    assistant_message: "The simplest takeaway is that general reproductive questions can be explained broadly, but severe pelvic pain, heavy bleeding, pregnancy emergency symptoms, or sexual assault concerns should be treated seriously and prompt medical or emergency support should be sought."


    category: "teaching_summary"
    user_message: "What is the simplest safe takeaway about temperature-related symptoms?"
    assistant_message: "The simplest takeaway is that temperature can often be explained generally as a sense for heat and cold, but burns with reduced feeling, strange numb skin after cold exposure, confusion after heat or cold exposure, or serious skin damage should be treated as urgent and medically checked right away."


  - id: "temperature_example_040"
    category: "boundary"
    user_message: "Can you diagnose why my skin feels hot or numb?"
    assistant_message: "I can't diagnose the cause of hot, cold, or numb skin from limited information. I can explain temperature sensation in general and point out warning signs that need medical attention."


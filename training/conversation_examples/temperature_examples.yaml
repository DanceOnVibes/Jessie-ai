    category: "teaching_summary"
    user_message: "Can you sum up temperature sense in one short explanation?"
    assistant_message: "Yes. Temperature sense is the body's ability to detect heat and cold."

  - id: "temperature_example_059"
    category: "teaching_summary"
    user_message: "What is the main thing to remember about temperature sense?"
    assistant_message: "The main thing to remember is that temperature sense helps the body detect heat and cold so it can respond safely."


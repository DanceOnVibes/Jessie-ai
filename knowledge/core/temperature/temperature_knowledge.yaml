knowledge_pack:
  file_name: "temperature_knowledge.yaml"
  version: "2.0"
  last_updated: "2026-09-21"
  purpose: "Expanded knowledge pack for teaching Jessie AI about body temperature, thermoregulation, fever, overheating, cold exposure, hydration, physiology, risk patterns, and safety escalation."
  audience: "Jessie AI training knowledge pack"
  source_type: "assistant-generated educational knowledge file"

  topic:
    name: "temperature"
    category: "body regulation and homeostasis"
    domain: "human body and health"

  overview:
    summary: "Body temperature is one of the body's core regulated internal conditions. The human body constantly balances heat production and heat loss to keep cells, organs, and systems working properly. Temperature regulation depends on the brain, blood vessels, skin, sweat glands, muscles, hormones, hydration, behavior, and the surrounding environment."
    why_it_matters:
      - "Enzymes and cells function best within a narrow internal temperature range."
      - "The brain, heart, and other organs can be harmed when temperature becomes too high or too low."
      - "Temperature changes can reflect normal physiology, infection, environmental stress, dehydration, endocrine problems, or nervous system dysfunction."
      - "Understanding temperature helps Jessie explain fever, chills, sweating, shivering, heat illness, and hypothermia clearly and safely."

  core_definitions:
    - term: "body temperature"
      definition: "The measure of the body's internal thermal state."
    - term: "thermoregulation"
      definition: "The body's process of maintaining a relatively stable internal temperature despite changes in activity, illness, or environment."
    - term: "homeostasis"
      definition: "The body's general process of keeping internal conditions stable, including temperature, fluids, blood pressure, and chemistry."
    - term: "core temperature"
      definition: "The temperature of the body's deep internal tissues and organs."
    - term: "peripheral temperature"
      definition: "The temperature closer to the body's surface, especially the skin and extremities."
    - term: "set point"
      definition: "The target temperature range the body is trying to maintain."
    - term: "fever"
      definition: "A regulated rise in body temperature, usually due to infection or inflammation, in which the body raises its internal set point."
    - term: "hyperthermia"
      definition: "An abnormally high body temperature caused by excess heat or failure of heat dissipation, not by a raised hypothalamic set point."
    - term: "hypothermia"
      definition: "A dangerous drop in core body temperature."

  foundational_principle:
    summary: "The body is always balancing heat gained, heat produced, and heat lost."
    key_points:
      - "Heat is generated by metabolism and muscle activity."
      - "Heat is lost through the skin, sweat evaporation, breathing, and contact with the environment."
      - "The body responds automatically, and people also respond behaviorally by seeking warmth, shade, water, rest, or clothing changes."

  controlling_systems:
    brain_control:
      structure: "hypothalamus"
      role: "The hypothalamus acts as the body's main temperature control center."
      functions:
        - "receives information from the body and environment"
        - "compares current temperature to the target range"
        - "triggers sweating, shivering, blood vessel changes, and behavioral urges"
    nervous_system:
      role: "Carries temperature information and helps coordinate responses such as sweating, shivering, and blood vessel constriction or dilation."
    circulatory_system:
      role: "Moves heat around the body and helps release or conserve heat through skin blood flow."
    skin:
      role: "Detects outside temperature and acts as a major site of heat exchange."
    sweat_glands:
      role: "Produce sweat for evaporative cooling."
    muscles:
      role: "Generate heat during movement and shivering."
    endocrine_influences:
      role: "Hormones can affect metabolic rate and heat production."
      examples:
        - "thyroid hormone"
        - "stress hormones"
        - "sex hormone changes"

  mechanisms_of_heat_production:
    - name: "basal metabolism"
      explanation: "Normal chemical activity in the body continuously produces heat."
    - name: "muscle activity"
      explanation: "Movement and exercise increase heat production."
    - name: "shivering"
      explanation: "Rapid involuntary muscle contractions generate additional heat when the body is cold."
    - name: "hormonal effects"
      explanation: "Some hormones increase metabolic activity and heat generation."

  mechanisms_of_heat_loss:
    - name: "radiation"
      explanation: "The body releases heat into the surrounding environment without direct contact."
    - name: "conduction"
      explanation: "Heat moves from the body to a cooler object through direct contact."
    - name: "convection"
      explanation: "Heat is carried away by moving air or water around the skin."
    - name: "evaporation"
      explanation: "Sweat evaporating from the skin removes heat from the body."
    - name: "respiratory heat loss"
      explanation: "Some heat is lost when warm, moist air is breathed out."

  vascular_responses:
    - name: "vasodilation"
      explanation: "Blood vessels near the skin widen to increase heat release."
      common_contexts:
        - "warm environment"
        - "exercise"
        - "flushing"
        - "fever breaking"
    - name: "vasoconstriction"
      explanation: "Blood vessels near the skin narrow to conserve heat."
      common_contexts:
        - "cold exposure"
        - "shock"
        - "early heat conservation"

  normal_patterns_and_variation:
    daily_variation:
      - "Body temperature can vary slightly over the course of the day."
      - "Temperature is often lower in the early morning and a little higher later in the day."
    activity_variation:
      - "Exercise and physical effort can temporarily increase temperature."
    environmental_variation:
      - "Warm weather, layers of clothing, humidity, and indoor heating can affect temperature comfort."
    individual_variation:
      - "Normal temperature is not identical in every person."
    life_stage_variation:
      - "Infants and older adults may regulate temperature less efficiently than healthy younger adults."

  fever_and_infection:
    what_fever_is:
      - "Fever is a regulated body response, often triggered by infection or inflammation."
      - "In fever, the body raises its temperature set point."
    why_chills_happen:
      - "If the body raises the set point, a person may feel cold and develop chills while the body tries to reach the new target."
    when_sweating_happens:
      - "Sweating may increase when the fever starts to come down."
    important_teaching_point:
      - "Fever is different from overheating. In fever, the body is intentionally regulating to a higher target."

  heat_related_illness_spectrum:
    heat_stress:
      description: "Early strain on the body from heat exposure."
      common_features:
        - "thirst"
        - "fatigue"
        - "feeling overheated"
    heat_cramps:
      description: "Painful muscle cramps related to heat and fluid or salt imbalance."
    heat_exhaustion:
      description: "A more serious heat-related illness with overheating, fluid loss, and weakness."
      common_features:
        - "heavy sweating"
        - "dizziness"
        - "headache"
        - "nausea"
        - "weakness"
        - "rapid pulse"
    heat_stroke:
      description: "A life-threatening emergency in which the body becomes dangerously overheated and normal brain or organ function may be affected."
      major_red_flags:
        - "confusion"
        - "collapse"
        - "fainting"
        - "seizure"
        - "unresponsiveness"
        - "very high temperature"
      teaching_priority: "Jessie should treat signs of heat stroke as an emergency."

  cold_related_illness_spectrum:
    cold_stress:
      description: "The body's early response to cold exposure."
      features:
        - "feeling cold"
        - "shivering"
        - "cold hands or feet"
    mild_hypothermia:
      description: "A drop in core temperature with active body compensation."
      possible_features:
        - "strong shivering"
        - "clumsiness"
        - "difficulty concentrating"
    worsening_hypothermia:
      description: "A more dangerous state in which the body begins failing to compensate."
      possible_features:
        - "confusion"
        - "slurred speech"
        - "marked drowsiness"
        - "slowed breathing"
        - "weakness"
    severe_hypothermia:
      description: "A life-threatening low body temperature emergency."
      emergency_features:
        - "minimal or absent shivering"
        - "reduced responsiveness"
        - "unconsciousness"

  hydration_relationship:
    summary: "Hydration is essential for healthy temperature control."
    mechanisms:
      - "Sweating depends on available body fluid."
      - "Dehydration reduces cooling efficiency."
      - "Fluid loss from fever, diarrhea, vomiting, or exercise raises heat illness risk."
    practical_point:
      - "People can become overheated faster when dehydrated."

  important_symptom_distinctions:
    - name: "fever vs hyperthermia"
      explanation: "Fever is a regulated rise in temperature due to a raised set point. Hyperthermia is overheating without a raised set point."
    - name: "chills vs cold exposure"
      explanation: "Chills can occur during fever even when the environment is not cold. Cold exposure happens when outside conditions pull body temperature down."
    - name: "normal sweating vs dangerous heat illness"
      explanation: "Sweating during heat or exercise can be normal. Sweating plus weakness, confusion, fainting, or collapse is more concerning."
    - name: "temporary cold hands vs hypothermia"
      explanation: "Cold hands can happen normally in cool weather. Hypothermia involves dangerous lowering of core body temperature."
    - name: "feeling hot vs heat emergency"
      explanation: "Feeling hot is common. Altered mental status, collapse, seizure, or inability to recover from heat is not normal."

  common_causes_of_temperature_change:
    infectious_or_inflammatory:
      - "viral infections"
      - "bacterial infections"
      - "systemic inflammation"
    environmental:
      - "hot weather"
      - "cold weather"
      - "humidity"
      - "poor ventilation"
      - "wind exposure"
      - "immersion in cold water"
    exertional:
      - "exercise"
      - "heavy physical work"
      - "sports in hot weather"
    endocrine_or_metabolic:
      - "thyroid disorders"
      - "metabolic changes"
    neurologic:
      - "nervous system dysfunction affecting temperature regulation"
    medication_or_substance_related:
      - "certain medications"
      - "alcohol"
      - "recreational drugs"
    situational:
      - "poor access to fluids"
      - "inadequate shelter"
      - "heavy clothing or protective gear"

  risk_groups:
    higher_risk:
      - "infants"
      - "older adults"
      - "people with chronic medical conditions"
      - "people with limited mobility"
      - "people exercising intensely in heat"
      - "people taking medications that affect sweating or fluid balance"
      - "people who are dehydrated"
      - "people without adequate heating or cooling"
    why_risk_is_higher:
      - "Some groups cannot adjust body temperature as efficiently."
      - "Some groups may not sense danger early or may be less able to respond behaviorally."

  common_user_questions_jessie_should_be_able_to_handle:
    - "Why do I get chills with a fever?"
    - "Why do I sweat so much in the heat?"
    - "What is the difference between fever and overheating?"
    - "Why am I cold when other people are comfortable?"
    - "What does shivering do?"
    - "When is heat dangerous?"
    - "What are warning signs of hypothermia?"
    - "How does dehydration affect temperature?"

  normal_vs_concerning_patterns:
    usually_benign_or_explainable:
      - "feeling warm after exercise"
      - "mild sweating in a hot room"
      - "brief chills at the start of a fever"
      - "feeling cool in a cold environment"
    monitor_or_review_if_persistent:
      - "recurrent night sweats"
      - "ongoing heat intolerance"
      - "ongoing cold intolerance"
      - "frequent unexplained chills"
      - "repeated fevers"
    more_concerning:
      - "high fever with weakness or confusion"
      - "persistent overheating"
      - "significant dehydration symptoms"
      - "temperature problems with chest pain or shortness of breath"
      - "temperature-related symptoms in a vulnerable person"
    emergency:
      - "confusion in heat"
      - "collapse in heat"
      - "seizure with high temperature"
      - "unresponsiveness"
      - "suspected heat stroke"
      - "suspected hypothermia with mental status changes"
      - "blue lips or severe breathing trouble"

  teaching_guidance_for_jessie:
    communication_goals:
      - "Explain temperature clearly in everyday language first."
      - "Add mechanism only when helpful."
      - "Differentiate normal body responses from warning signs."
      - "Stay calm and practical."
      - "Escalate firmly when emergencies are described."
    style_notes:
      - "Avoid sounding alarmist about mild temperature variation."
      - "Avoid minimizing confusion, fainting, or collapse."
      - "Use distinctions such as fever versus overheating when relevant."
      - "Tie symptoms back to hydration, environment, infection, and body regulation."
    teaching_sequence:
      - "Say what temperature regulation is."
      - "Explain how the body cools or warms itself."
      - "Clarify the specific symptom the user asked about."
      - "State what is common versus concerning."
      - "Escalate if red flags are present."

  cross_system_links:
    - "Temperature regulation is linked to the nervous system because the brain coordinates responses."
    - "It is linked to the circulatory system because blood flow helps move and release heat."
    - "It is linked to the integumentary system because skin and sweat glands are central to cooling."
    - "It is linked to the muscular system because muscles generate heat and shivering."
    - "It is linked to the endocrine system because hormones affect metabolism."
    - "It is linked to hydration and the urinary system because fluid balance affects sweating and cooling."

  red_flags:
    immediate_attention:
      - "confusion"
      - "fainting"
      - "collapse"
      - "seizure"
      - "extreme drowsiness"
      - "unresponsiveness"
      - "blue lips"
      - "severe trouble breathing"
      - "very high temperature with severe symptoms"
      - "suspected heat stroke"
      - "suspected severe hypothermia"

  example_jessie_framing:
    explanation_examples:
      - "The body regulates temperature by balancing heat production and heat loss."
      - "Sweating helps cool the body, while shivering helps create heat."
      - "Fever and overheating are different. Fever is usually part of the body's response to illness, while overheating happens when the body cannot release heat effectively."
      - "Cold exposure can make the body conserve heat by narrowing blood vessels and triggering shivering."
    caution_examples:
      - "Feeling warm after exercise can be normal, but confusion or collapse in heat is an emergency."
      - "Shivering can be a normal cold response, but severe cold with confusion or unusual drowsiness needs urgent attention."

  final_summary:
    summary_points:
      - "Temperature is a tightly regulated part of homeostasis."
      - "The hypothalamus, skin, blood vessels, sweat glands, muscles, and hormones all contribute to temperature control."
      - "The body uses sweating, vasodilation, shivering, and vasoconstriction to maintain balance."
      - "Fever is different from environmental overheating."
      - "Severe heat illness and hypothermia are medical emergencies."
      - "Jessie should teach clearly, distinguish normal from concerning, and escalate red-flag situations immediately."

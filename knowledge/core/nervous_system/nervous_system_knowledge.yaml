knowledge_pack:
  file_name: nervous_system_knowledge.yaml
  version: '2.0'
  last_updated: '2026-10-17'
  status: DRAFT for owner review. The previous file in this folder was an accidental copy of the muscular
    system pack, so this is a new pack written as school science. Every fact needs a check against the
    sources listed below before it goes live.
  purpose: Teacher pack for the brain, spinal cord, and nerves, how messages travel around the body,
    reflexes, the senses, and looking after the brain. Written as school science for learners, not as
    health advice.
  audience: Jessie AI training knowledge pack
  source_type: structured educational knowledge file
  topic:
    name: nervous_system
    category: body control and communication
    domain: human body and health
  overview:
    summary: The nervous system is the body's message network. The brain and spinal cord are the control
      centre, and nerves carry messages to and from every part of the body. It lets us sense the world,
      think, remember, feel, and move, and it keeps the heart beating and the lungs breathing without us
      having to think about it.
    why_it_matters:
    - Learners think the brain only does thinking. It also controls breathing, heartbeat, balance, and
      movement.
    - They think messages in nerves are slow. Some travel at over 400 kilometres per hour.
    - They think we only use 10 per cent of our brain. That is a myth; we use all of it, just not all at
      once.
    - They do not know that a reflex can happen before the brain has even noticed.
    - They do not know that the left side of the brain mostly controls the right side of the body, and the
      other way round.
  core_definitions:
  - term: nervous system
    definition: The body's message network, made of the brain, spinal cord, and nerves.
  - term: brain
    definition: The organ inside the skull that controls the body, makes sense of the senses, and lets us
      think, feel, and remember.
  - term: spinal cord
    definition: A thick bundle of nerves running down the back, inside the spine, linking the brain to the
      body.
  - term: nerve
    definition: A bundle of fibres that carries messages between the brain or spinal cord and the body.
  - term: neuron
    definition: A nerve cell. Neurons pass tiny electrical and chemical signals to each other.
  - term: reflex
    definition: A fast, automatic reaction that happens without you deciding, such as pulling your hand
      away from something hot.
  - term: senses
    definition: The ways the body gathers information, including sight, hearing, touch, taste, and smell.
  - term: cerebrum
    definition: The largest part of the brain, used for thinking, memory, language, and choosing to move.
  - term: cerebellum
    definition: The part at the back of the brain that helps with balance and smooth movement.
  - term: brainstem
    definition: The part of the brain that joins the spinal cord and controls breathing, heartbeat, and
      sleep and wake.

  teaching_levels:
    note: Every topic has three depths. Start simple. Go curious next. Give the deep account only when the
      learner asks or clearly wants more.
    the_message_network:
      simple: Your brain is the boss of your body. Nerves carry messages from your body to your brain, and
        from your brain back to your body.
      curious: When you touch something, nerves in your skin send a message up to your brain, and your
        brain works out what it is. When you decide to move, your brain sends a message down to your
        muscles.
      deep: The brain and spinal cord form the central nervous system. All the nerves that branch out to
        the rest of the body form the peripheral nervous system. Messages travel as tiny electrical signals
        along neurons and jump between them using chemicals.
    the_brain:
      simple: Your brain is inside your skull, which protects it. It helps you think, learn, feel, and
        remember.
      curious: Different parts of the brain have different jobs. The big wrinkly cerebrum handles thinking
        and memory. The cerebellum helps with balance. The brainstem keeps you breathing and your heart
        beating.
      deep: The human brain has about 86 billion neurons, each connected to thousands of others. The left
        side of the brain mostly controls the right side of the body, and the right side controls the left.
        Learning new things strengthens the connections between neurons, which is why practice helps.
    reflexes:
      simple: A reflex is a super-fast move your body makes without you deciding, like blinking when
        something comes near your eye.
      curious: If you touch something hot, your hand jumps away before you even feel the pain. The message
        goes to your spinal cord and straight back to your muscles, taking a shortcut that saves time.
      deep: This shortcut is called a reflex arc. The message still reaches the brain a moment later, which
        is when you notice the pain. Doctors tap just below the knee to check the knee-jerk reflex.
    how_fast_messages_travel:
      simple: Nerve messages are very fast, much faster than you can blink.
      curious: The fastest nerve messages travel at over 400 kilometres per hour, quicker than a racing
        car.
      deep: Speed depends on the nerve. Nerves wrapped in a fatty coating called myelin carry messages
        fastest, up to about 120 metres per second. Messages about slow, dull aches travel more slowly.
    senses:
      simple: Your senses tell your brain about the world. Eyes see, ears hear, the nose smells, the tongue
        tastes, and the skin feels.
      curious: Each sense has special cells that turn light, sound, smells, tastes, or touch into nerve
        messages for the brain.
      deep: The body has more senses than the famous five, including balance, the sense of where your body
        parts are, called proprioception, and the sense of hot and cold. Other Jessie packs cover these in
        detail.
    looking_after_your_brain:
      simple: Sleep, good food, water, exercise, and wearing a helmet when cycling or skating all help
        protect your brain.
      curious: Sleep helps the brain sort and store what you learned during the day. Exercise helps blood
        carry oxygen to the brain.
      deep: The skull, layers of tough tissue, and a cushion of fluid protect the brain. Even so, a hard
        bump to the head can hurt it, so if someone bangs their head, they should always tell a trusted
        adult straight away.

  common_questions_jessie_should_handle:
  - question: Do we only use 10 per cent of our brain?
    answer: No, that is a myth. Brain scans show that we use all parts of the brain, though not all at the
      same time.
  - question: Why do I pull my hand away from something hot before I feel it?
    answer: That is a reflex. The message takes a shortcut through the spinal cord, so your muscles move
      before your brain notices the pain.
  - question: Does the brain feel pain?
    answer: The brain itself has no pain sensors, but it is where the feeling of pain is made from messages
      sent by nerves in the body.

  story_starters:
  - Imagine you are a tiny message racing along a nerve, from your fingertip all the way up to your brain.
  - Picture your brain as a busy city at night, with billions of lights flickering as messages zip
    between them.

  picture_guidance:
  - Brain and nerve pictures are diagrams. Do not let an AI picture carry labels; the app adds them.
  - Keep pictures friendly and non-medical. No injuries, surgery, or scans of real patients.

  curriculum_links:
    key_stage_2: The senses; how the body moves; healthy lifestyles, including sleep and exercise.
    key_stage_3: Cells, including nerve cells; how the body is organised into systems; the effect of
      exercise and lifestyle on health.

  boundaries:
  - Teach school science. Do not diagnose, give medical advice, or talk about illnesses or symptoms in
    detail.
  - If a learner says they or someone else is hurt, has hit their head, or feels unwell, tell them to tell
    a trusted adult straight away. In an emergency an adult should call 999. For urgent advice in the UK,
    an adult can call NHS 111.
  - Do not describe injuries or surgery.

  sources_to_check:
  - BBC Bitesize, nervous system pages (bbc.co.uk/bitesize)
  - NHS, how the brain and nerves work (nhs.uk)
  - National curriculum in England, science programmes of study (gov.uk)
